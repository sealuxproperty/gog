<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Gameplay Over Graphics</title>
<meta name="description" content="Get in touch with Gameplay Over Graphics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
<a class="brand" href="index.html">Gameplay Over Graphics</a>
<nav aria-label="Main">
<a href="index.html">Home</a>
<a href="games.html">Games</a>
<a href="contact.html" aria-current="page">Contact Us</a>
</nav></div></header>
<main><div class="wrap">
<h1>Contact us</h1>
<p class="lede">Questions, bug reports or privacy requests. We read everything.</p>
<form id="contact-form">
<label>Name<input name="name" autocomplete="name" required></label>
<label>Email<input type="email" name="email" autocomplete="email" required></label>
<label>Message<textarea name="message" required></textarea></label>
<div class="contact-hp" aria-hidden="true" style="position:absolute;left:-9999px"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
<button class="btn" type="submit">Send message</button>
<p id="form-status" role="status" aria-live="polite"></p>
</form>
<p class="section">Or email us directly at <a href="mailto:gameplayographics@gmail.com">gameplayographics@gmail.com</a>.</p>
</div></main>
<footer><div class="wrap">
<span>&copy; <span id="y">2026</span> Gameplay Over Graphics</span>
<span><a href="fortifi-privacy.html">Privacy policy</a> &middot; <a href="contact.html">Contact</a></span>
</div></footer>
<script>document.getElementById("y").textContent=new Date().getFullYear()</script>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwg3M6s1Uzv4VVQ3CyRoJ3qeLAqJwShG9F9Bvr9yvNIPwNODdIgFHLyEzg_UqlVpG6B/exec";
const form = document.getElementById("contact-form");
const status = document.getElementById("form-status");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  if (SCRIPT_URL.startsWith("PASTE_")) {
    status.textContent = "Contact form is not configured yet.";
    return;
  }
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  status.textContent = "Sending...";
  try {
    // Apps Script web apps do not provide CORS response headers for browser fetch.
    // no-cors sends the request but cannot confirm server-side delivery.
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: new URLSearchParams(new FormData(form))
    });
    status.textContent = "Message submitted. Thank you!";
    form.reset();
  } catch (error) {
    status.textContent = "Could not submit your message. Please email us directly.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
